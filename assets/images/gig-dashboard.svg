<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#090d14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="gig-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c131a"/>
      <stop offset="100%" stop-color="#070b0f"/>
    </linearGradient>
    <linearGradient id="gig-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bar-gross" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bar-net" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#gig-bg)"/>

  <!-- Top App Header -->
  <rect x="0" y="0" width="800" height="46" fill="#0c141d" opacity="0.95"/>
  <line x1="0" y1="46" x2="800" y2="46" stroke="#1b2a3a" stroke-width="1"/>
  
  <circle cx="24" cy="23" r="5" fill="#ef4444"/>
  <circle cx="39" cy="23" r="5" fill="#f59e0b"/>
  <circle cx="54" cy="23" r="5" fill="#10b981"/>
  
  <text x="80" y="27" fill="#f8fafc" font-size="12" font-weight="700" letter-spacing="0.5">TRANSPARENT GIG · REAL-WAGE AUDITOR &amp; LOG ANALYZER</text>
  <rect x="520" y="14" width="124" height="18" rx="9" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
  <text x="530" y="27" fill="#34d399" font-size="10" font-weight="600">AUDITED: 1,420 TRIPS</text>
  
  <rect x="652" y="14" width="124" height="18" rx="9" fill="#1e293b"/>
  <text x="662" y="27" fill="#38bdf8" font-size="10" font-family="monospace">DATA INTEGRITY: 100%</text>

  <!-- Top Metrics Bar -->
  <g transform="translate(24, 62)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="234" height="78" rx="8" fill="#0d1824" stroke="#1e2f42" stroke-width="1"/>
    <text x="16" y="22" fill="#64748b" font-size="10" font-weight="600">STATED GROSS WAGE</text>
    <text x="16" y="48" fill="#38bdf8" font-size="22" font-weight="700">$28.40</text>
    <text x="100" y="48" fill="#64748b" font-size="12">/ booked hr</text>
    <text x="16" y="66" fill="#0284c7" font-size="10">Platform displayed estimate</text>

    <!-- KPI 2 -->
    <rect x="254" y="0" width="244" height="78" rx="8" fill="#0d1824" stroke="#10b981" stroke-width="1.2"/>
    <text x="16" y="22" fill="#10b981" font-size="10" font-weight="700">ACTUAL EFFECTIVE WAGE</text>
    <text x="16" y="48" fill="#10b981" font-size="22" font-weight="700">$17.85</text>
    <text x="100" y="48" fill="#94a3b8" font-size="12">/ total on-call hr</text>
    <text x="16" y="66" fill="#ef4444" font-size="10" font-weight="600">-37.1% Wage Discrepancy</text>

    <!-- KPI 3 -->
    <rect x="518" y="0" width="234" height="78" rx="8" fill="#0d1824" stroke="#1e2f42" stroke-width="1"/>
    <text x="16" y="22" fill="#64748b" font-size="10" font-weight="600">UNPAID WAITING GAPS</text>
    <text x="16" y="48" fill="#f59e0b" font-size="22" font-weight="700">38.4%</text>
    <text x="100" y="48" fill="#64748b" font-size="12">idle deadhead</text>
    <text x="16" y="66" fill="#eab308" font-size="10">14.6 hrs/wk unpaid wait time</text>
  </g>

  <!-- Left Main Chart: Gross vs Net Wage Breakdown -->
  <g transform="translate(24, 156)">
    <rect width="478" height="270" rx="10" fill="#0d1824" stroke="#1e2f42" stroke-width="1"/>
    <text x="20" y="26" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">WEEKLY PAYROLL DEDUCTION AUDIT (HOURLY AUDIT)</text>

    <!-- Bars for Days Mon-Sun -->
    <g transform="translate(40, 50)">
      <!-- Mon -->
      <text x="18" y="180" fill="#64748b" font-size="10" text-anchor="middle">Mon</text>
      <rect x="8" y="40" width="20" height="120" rx="3" fill="url(#bar-gross)"/>
      <rect x="8" y="85" width="20" height="75" rx="3" fill="url(#bar-net)"/>

      <!-- Tue -->
      <text x="78" y="180" fill="#64748b" font-size="10" text-anchor="middle">Tue</text>
      <rect x="68" y="30" width="20" height="130" rx="3" fill="url(#bar-gross)"/>
      <rect x="68" y="80" width="20" height="80" rx="3" fill="url(#bar-net)"/>

      <!-- Wed -->
      <text x="138" y="180" fill="#64748b" font-size="10" text-anchor="middle">Wed</text>
      <rect x="128" y="50" width="20" height="110" rx="3" fill="url(#bar-gross)"/>
      <rect x="128" y="95" width="20" height="65" rx="3" fill="url(#bar-net)"/>

      <!-- Thu -->
      <text x="198" y="180" fill="#64748b" font-size="10" text-anchor="middle">Thu</text>
      <rect x="188" y="35" width="20" height="125" rx="3" fill="url(#bar-gross)"/>
      <rect x="188" y="82" width="20" height="78" rx="3" fill="url(#bar-net)"/>

      <!-- Fri -->
      <text x="258" y="180" fill="#64748b" font-size="10" text-anchor="middle">Fri</text>
      <rect x="248" y="15" width="20" height="145" rx="3" fill="url(#bar-gross)"/>
      <rect x="248" y="55" width="20" height="105" rx="3" fill="url(#bar-net)"/>

      <!-- Sat -->
      <text x="318" y="180" fill="#64748b" font-size="10" text-anchor="middle">Sat</text>
      <rect x="308" y="10" width="20" height="150" rx="3" fill="url(#bar-gross)"/>
      <rect x="308" y="50" width="20" height="110" rx="3" fill="url(#bar-net)"/>

      <!-- Sun -->
      <text x="378" y="180" fill="#64748b" font-size="10" text-anchor="middle">Sun</text>
      <rect x="368" y="25" width="20" height="135" rx="3" fill="url(#bar-gross)"/>
      <rect x="368" y="70" width="20" height="90" rx="3" fill="url(#bar-net)"/>
    </g>

    <!-- Legend -->
    <g transform="translate(24, 245)">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#38bdf8"/>
      <text x="18" y="10" fill="#94a3b8" font-size="10">App In-Trip Gross Rate</text>
      
      <rect x="160" y="0" width="12" height="12" rx="2" fill="#10b981"/>
      <text x="178" y="10" fill="#94a3b8" font-size="10">Actual Net (Unpaid Idle Deducted)</text>
    </g>
  </g>

  <!-- Right Panel: Trip Log Parsing Breakdown -->
  <g transform="translate(518, 156)">
    <rect width="258" height="270" rx="10" fill="#0d1824" stroke="#1e2f42" stroke-width="1"/>
    <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">PARSED TRIP TELEMETRY</text>

    <g transform="translate(16, 46)">
      <rect width="226" height="50" rx="6" fill="#132131"/>
      <text x="12" y="18" fill="#64748b" font-size="9">PLATFORM TAKE-RATE</text>
      <text x="12" y="38" fill="#f43f5e" font-size="16" font-weight="700">29.4%</text>
      <text x="74" y="38" fill="#64748b" font-size="10">avg commission fee</text>

      <rect y="58" width="226" height="50" rx="6" fill="#132131"/>
      <text x="12" y="76" fill="#64748b" font-size="9">DEADHEAD FUEL EXPENSE</text>
      <text x="12" y="96" fill="#f59e0b" font-size="16" font-weight="700">$4.12</text>
      <text x="64" y="96" fill="#64748b" font-size="10">/ unpaid hour idle</text>

      <rect y="116" width="226" height="84" rx="6" fill="#1b2a3a"/>
      <text x="12" y="136" fill="#38bdf8" font-size="10" font-weight="700">CLIENT-SIDE LOG PARSER</text>
      <text x="12" y="154" fill="#cbd5e1" font-size="10">Regex + CSV trip ingestion</text>
      <text x="12" y="170" fill="#64748b" font-size="10">Zero cloud database upload</text>
      <text x="12" y="188" fill="#10b981" font-size="10" font-family="monospace">Privacy: 100% In-Browser</text>
    </g>
  </g>
</svg>