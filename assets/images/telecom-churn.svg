<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#090d14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="tc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="curve-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="risk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#tc-bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="130" x2="800" y2="130"/>
    <line x1="0" y1="210" x2="800" y2="210"/>
    <line x1="0" y1="290" x2="800" y2="290"/>
    <line x1="0" y1="370" x2="800" y2="370"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Top App Header -->
  <rect x="0" y="0" width="800" height="46" fill="#0b101a" opacity="0.95"/>
  <line x1="0" y1="46" x2="800" y2="46" stroke="#1e293b" stroke-width="1"/>
  
  <circle cx="24" cy="23" r="5" fill="#ef4444"/>
  <circle cx="39" cy="23" r="5" fill="#f59e0b"/>
  <circle cx="54" cy="23" r="5" fill="#10b981"/>
  
  <text x="80" y="27" fill="#f8fafc" font-size="12" font-weight="700" letter-spacing="0.5">TELECOM CUSTOMER CHURN PIPELINE</text>
  <rect x="330" y="14" width="94" height="18" rx="9" fill="#1e293b"/>
  <text x="340" y="27" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="600">STACKING v1.4</text>
  
  <rect x="432" y="14" width="112" height="18" rx="9" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
  <text x="440" y="27" fill="#34d399" font-size="10" font-weight="600">AUC-ROC: 0.892</text>
  
  <rect x="552" y="14" width="102" height="18" rx="9" fill="#1e1b4b" stroke="#4f46e5" stroke-width="0.8"/>
  <text x="560" y="27" fill="#a5b4fc" font-size="10" font-weight="600">ACCURACY: 86.4%</text>

  <!-- Left Card: Feature Importance (Scikit-Learn RFE + ANOVA) -->
  <g transform="translate(24, 62)">
    <rect width="230" height="364" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">FEATURE IMPORTANCE (RFE)</text>
    
    <!-- Bar 1 -->
    <text x="16" y="58" fill="#e2e8f0" font-size="11">Contract_Type (Month)</text>
    <rect x="16" y="66" width="198" height="8" rx="4" fill="#1e293b"/>
    <rect x="16" y="66" width="182" height="8" rx="4" fill="url(#bar-grad)"/>
    <text x="180" y="58" fill="#38bdf8" font-size="10" font-family="monospace">0.34</text>

    <!-- Bar 2 -->
    <text x="16" y="98" fill="#e2e8f0" font-size="11">Tenure_Months</text>
    <rect x="16" y="106" width="198" height="8" rx="4" fill="#1e293b"/>
    <rect x="16" y="106" width="154" height="8" rx="4" fill="url(#bar-grad)"/>
    <text x="180" y="98" fill="#38bdf8" font-size="10" font-family="monospace">0.26</text>

    <!-- Bar 3 -->
    <text x="16" y="138" fill="#e2e8f0" font-size="11">Internet_FiberOptic</text>
    <rect x="16" y="146" width="198" height="8" rx="4" fill="#1e293b"/>
    <rect x="16" y="146" width="124" height="8" rx="4" fill="url(#bar-grad)"/>
    <text x="180" y="138" fill="#38bdf8" font-size="10" font-family="monospace">0.19</text>

    <!-- Bar 4 -->
    <text x="16" y="178" fill="#e2e8f0" font-size="11">MonthlyCharges</text>
    <rect x="16" y="186" width="198" height="8" rx="4" fill="#1e293b"/>
    <rect x="16" y="186" width="94" height="8" rx="4" fill="url(#bar-grad)"/>
    <text x="180" y="178" fill="#38bdf8" font-size="10" font-family="monospace">0.14</text>

    <!-- Bar 5 -->
    <text x="16" y="218" fill="#e2e8f0" font-size="11">TechSupport_No</text>
    <rect x="16" y="226" width="198" height="8" rx="4" fill="#1e293b"/>
    <rect x="16" y="226" width="56" height="8" rx="4" fill="url(#bar-grad)"/>
    <text x="180" y="218" fill="#38bdf8" font-size="10" font-family="monospace">0.07</text>

    <!-- Stat Callout -->
    <rect x="16" y="260" width="198" height="84" rx="8" fill="#131c31" stroke="#2563eb" stroke-dasharray="3 3"/>
    <text x="26" y="284" fill="#93c5fd" font-size="10" font-weight="600">ENSEMBLE LAYERING</text>
    <text x="26" y="302" fill="#e2e8f0" font-size="11">RandomForest + LightGBM</text>
    <text x="26" y="322" fill="#64748b" font-size="10">Meta: Logistic Regression</text>
  </g>

  <!-- Center Card: ROC Curve & Confusion Matrix -->
  <g transform="translate(268, 62)">
    <rect width="280" height="364" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">ROC-AUC PERFORMANCE CURVE</text>
    
    <!-- ROC Curve Chart -->
    <g transform="translate(24, 46)">
      <line x1="0" y1="180" x2="230" y2="180" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="180" stroke="#334155" stroke-width="1"/>
      <!-- Diagonal random guess -->
      <line x1="0" y1="180" x2="230" y2="0" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
      
      <!-- Stacking Model ROC Curve -->
      <path d="M 0 180 Q 20 20 230 0 L 230 180 Z" fill="url(#curve-grad)"/>
      <path d="M 0 180 Q 20 20 230 0" fill="none" stroke="#10b981" stroke-width="2.5"/>
      
      <circle cx="48" cy="46" r="4" fill="#38bdf8"/>
      <text x="56" y="44" fill="#38bdf8" font-size="10" font-weight="600">Optimal Threshold (0.42)</text>
    </g>

    <!-- Confusion Matrix Mini Grid -->
    <text x="16" y="260" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">VALIDATION MATRIX (7,043 RECORDS)</text>
    <g transform="translate(24, 276)">
      <rect x="0" y="0" width="110" height="34" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
      <text x="10" y="16" fill="#a7f3d0" font-size="9">True Retain</text>
      <text x="10" y="28" fill="#ffffff" font-size="11" font-weight="700">4,620 (89.2%)</text>
      
      <rect x="120" y="0" width="110" height="34" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="0.8"/>
      <text x="130" y="16" fill="#fca5a5" font-size="9">False Churn</text>
      <text x="130" y="28" fill="#ffffff" font-size="11" font-weight="700">554 (10.8%)</text>

      <rect x="0" y="40" width="110" height="34" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="0.8"/>
      <text x="10" y="56" fill="#fca5a5" font-size="9">False Retain</text>
      <text x="10" y="68" fill="#ffffff" font-size="11" font-weight="700">382 (20.4%)</text>

      <rect x="120" y="40" width="110" height="34" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
      <text x="130" y="56" fill="#a7f3d0" font-size="9">True Churn</text>
      <text x="130" y="68" fill="#ffffff" font-size="11" font-weight="700">1,487 (79.6%)</text>
    </g>
  </g>

  <!-- Right Card: Risk Score Distribution -->
  <g transform="translate(562, 62)">
    <rect width="214" height="364" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">RISK PROBABILITY</text>
    
    <g transform="translate(16, 50)">
      <rect width="182" height="12" rx="6" fill="url(#risk-grad)"/>
      <polygon points="120,24 114,34 126,34" fill="#f8fafc"/>
      <text x="96" y="46" fill="#f8fafc" font-size="10" font-family="monospace">Risk: 0.68</text>
    </g>

    <text x="16" y="126" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">SEGMENT TELEMETRY</text>
    
    <rect x="16" y="142" width="182" height="52" rx="6" fill="#131c31"/>
    <text x="26" y="162" fill="#64748b" font-size="9">HIGH RISK ACCOUNTS</text>
    <text x="26" y="182" fill="#ef4444" font-size="16" font-weight="700">1,869</text>
    <text x="110" y="182" fill="#64748b" font-size="10">26.5% total</text>

    <rect x="16" y="204" width="182" height="52" rx="6" fill="#131c31"/>
    <text x="26" y="224" fill="#64748b" font-size="9">PREVENTABLE LOSS</text>
    <text x="26" y="244" fill="#f59e0b" font-size="16" font-weight="700">$142.8K</text>
    <text x="110" y="244" fill="#64748b" font-size="10">/ month ARR</text>

    <rect x="16" y="266" width="182" height="78" rx="6" fill="#1e293b"/>
    <text x="26" y="288" fill="#38bdf8" font-size="10" font-weight="700">DEPLOYED INFERENCE</text>
    <text x="26" y="306" fill="#cbd5e1" font-size="10">Batch scoring via Python</text>
    <text x="26" y="324" fill="#10b981" font-size="10" font-family="monospace">Latency: 4.8ms / row</text>
  </g>
</svg>